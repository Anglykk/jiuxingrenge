<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>九型人格测评</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(165deg, #eaf7f2 0%, #f6fbf9 45%, #e6f4ef 100%);
    background-attachment: fixed;
    min-height:100vh; color:#1f3b34; padding:16px;
    display:flex; justify-content:center;
  }
  .app { width:100%; max-width:640px; }

  #screen-start { text-align:center; padding-top:10vh; }
  #screen-start h1 {
    font-size:28px; font-weight:700; letter-spacing:2px; margin-bottom:14px;
    background:linear-gradient(90deg,#0d9488,#14b8a6,#34d399);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #screen-start .sub { font-size:14px; color:#5b7a72; line-height:1.9; margin-bottom:32px; }

  .btn {
    display:inline-block; padding:14px 52px; border:none; border-radius:999px;
    font-size:16px; font-weight:600; cursor:pointer; color:#fff;
    background:linear-gradient(135deg,#14b8a6,#0d9488);
    box-shadow:0 8px 22px rgba(13,148,136,.28);
    transition:transform .15s;
  }
  .btn:active { transform:scale(.96); }
  .btn.ghost {
    background:rgba(255,255,255,.85); color:#0d9488;
    border:1.5px solid rgba(20,184,166,.28);
    box-shadow:none; margin-left:8px;
  }
  .disclaimer { margin-top:36px; font-size:12px; color:#8aa39c; line-height:1.8; padding:0 20px; }

  #screen-info { display:none; padding-top:4vh; }
  .info-title { font-size:22px; font-weight:700; text-align:center; margin-bottom:8px; }
  .info-sub { font-size:13px; color:#5b7a72; text-align:center; margin-bottom:28px; line-height:1.8; }

  .field { margin-bottom:18px; }
  .field label { display:block; font-size:13px; font-weight:600; color:#3d5c54; margin-bottom:8px; }
  .field label .req { color:#d96b7a; margin-left:2px; }
  .field input {
    width:100%; padding:14px 16px; font-size:15px; color:#1f3b34;
    background:rgba(255,255,255,.85);
    border:1.5px solid rgba(20,184,166,.20);
    border-radius:12px; outline:none; font-family:inherit;
  }
  .field input:focus {
    border-color:rgba(20,184,166,.55);
    box-shadow:0 0 0 3px rgba(20,184,166,.10);
    background:#fff;
  }
  .field .err { font-size:12px; color:#d96b7a; margin-top:6px; display:none; }
  .field.invalid input { border-color:#d96b7a; }
  .field.invalid .err { display:block; }

  .agree { display:flex; align-items:flex-start; gap:9px;
    font-size:12px; color:#7a948d; line-height:1.7; margin:22px 0 10px; }
  .agree input { flex-shrink:0; width:16px; height:16px; margin-top:2px; accent-color:#14b8a6; }

  #screen-quiz { display:none; }
  .topbar { display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color:#5b7a72; margin-bottom:10px; }
  .progress-wrap { height:6px; background:rgba(20,184,166,.14); border-radius:3px; overflow:hidden; margin-bottom:28px; }
  .progress-bar { height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg,#34d399,#10b981); transition:width .35s ease; }

  .q-index { font-size:12px; color:#0d9488; font-weight:700; letter-spacing:1px; margin-bottom:12px; }
  .q-text { font-size:17px; line-height:1.75; font-weight:600; margin-bottom:24px; color:#1f3b34; }

  .opt {
    display:flex; align-items:flex-start; gap:12px;
    background:rgba(255,255,255,.78);
    border:1.5px solid rgba(20,184,166,.16);
    border-radius:14px; padding:16px 18px; margin-bottom:11px;
    cursor:pointer; transition:all .18s; font-size:15px; line-height:1.6;
  }
  .opt:hover { background:#fff; border-color:rgba(20,184,166,.45); transform:translateY(-1px); }
  .opt:active { transform:scale(.985); }
  .opt .tag {
    flex-shrink:0; width:24px; height:24px; border-radius:50%;
    background:rgba(20,184,166,.14); color:#0d9488;
    font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .opt.chosen {
    border-color:#14b8a6; background:#fff;
    box-shadow:0 0 0 3px rgba(20,184,166,.12);
  }
  .opt.chosen .tag { background:#14b8a6; color:#fff; }

  .navrow { display:flex; gap:10px; margin-top:22px; }
  .navrow .btn { flex:1; padding:13px 0; font-size:15px; }
  .navrow .btn.ghost { margin-left:0; }

  #screen-result { display:none; }
  .res-title { font-size:22px; font-weight:700; text-align:center; margin-bottom:20px; }

  /* ===== 一行三段的基本信息 ===== */
  .person-card {
    display:flex; align-items:stretch;
    padding:14px 6px !important; margin-bottom:20px !important;
  }
  .pc-item {
    flex:1; min-width:0; padding:0 10px;
    display:flex; flex-direction:column; align-items:center; gap:5px;
    position:relative;
  }
  .pc-item + .pc-item::before {
    content:""; position:absolute; left:0; top:15%; bottom:15%;
    width:1px; background:rgba(20,184,166,.16);
  }
  .pc-label {
    color:#7a948d; font-size:11px; letter-spacing:.5px;
    flex-shrink:0; white-space:nowrap;
  }
  .pc-val {
    color:#1f3b34; font-weight:700; font-size:13.5px; line-height:1.4;
    text-align:center; word-break:break-all; max-width:100%;
  }
  .pc-val.phone { font-size:12.5px; letter-spacing:.2px; }

  .res-main { text-align:center; font-size:14px; color:#5b7a72; margin-bottom:20px; }
  .res-main b { color:#0d9488; font-size:17px; }

  .legend {
    display:flex; justify-content:center; gap:18px; flex-wrap:wrap;
    font-size:12px; color:#5b7a72; margin-bottom:18px;
  }
  .legend i {
    display:inline-block; width:11px; height:11px; border-radius:3px;
    margin-right:5px; vertical-align:-1px;
  }
  .legend .k-yes    { background:linear-gradient(90deg,#34d399,#10b981); }
  .legend .k-unsure { background:#cfd8d5; }
  .legend .k-no     { background:#f0a8b2; }

  .chart { margin-bottom:26px; }

  .row { display:flex; align-items:center; margin-bottom:14px; font-size:13px; }
  .row .name {
    width:96px; flex-shrink:0; color:#3d5c54; font-size:12.5px;
    line-height:1.3; font-variant-numeric:tabular-nums;
  }
  .row.top .name { color:#0d9488; font-weight:700; }

  .row .track {
    flex:1; height:26px; border-radius:8px; overflow:hidden;
    display:flex; background:rgba(20,184,166,.06);
  }

  .seg {
    height:100%; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#fff;
    font-variant-numeric:tabular-nums;
    transition:width .7s cubic-bezier(.2,.8,.2,1);
    overflow:hidden; white-space:nowrap;
  }
  .seg-yes    { background:linear-gradient(90deg,#34d399,#10b981); }
  .seg-unsure { background:#cfd8d5; color:#5b6b66; }
  .seg-no     { background:#f0a8b2; color:#8a3b48; }

  .card { background:rgba(255,255,255,.72); border:1px solid rgba(20,184,166,.14);
    border-radius:16px; padding:20px; margin-bottom:16px; line-height:1.8; font-size:14px; }
  .card h3 { font-size:15px; color:#0d9488; margin-bottom:10px; }

  .toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%);
    background:rgba(31,59,52,.92); color:#fff; padding:10px 22px; border-radius:999px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s;
    white-space:nowrap; z-index:99; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="app">

  <section id="screen-start">
    <h1>九型人格测评</h1>
    <p class="sub">
      共 180 道题，约需 15 分钟<br>
      每题三个选项：符合 / 不确定 / 不符合<br>
      凭第一直觉作答，不必反复权衡
    </p>
    <button class="btn" id="start-btn" onclick="goInfo()">开始测试</button>
    <p class="disclaimer">
      本测试用于自我认知参考，不作为心理诊断依据。<br>
    </p>
  </section>

  <section id="screen-info">
    <h2 class="info-title">填写基本信息</h2>
    <p class="info-sub">信息仅用于面试评估与结果归档</p>

    <div class="field" id="f-name">
      <label>姓名<span class="req">*</span></label>
      <input type="text" id="in-name" placeholder="请输入真实姓名" maxlength="20" autocomplete="name">
      <div class="err">请填写姓名</div>
    </div>

    <div class="field" id="f-phone">
      <label>手机号<span class="req">*</span></label>
      <input type="tel" id="in-phone" placeholder="请输入 11 位手机号" maxlength="11" inputmode="numeric" autocomplete="tel">
      <div class="err">请填写正确的 11 位手机号</div>
    </div>

    <div class="field" id="f-position">
      <label>面试岗位<span class="req">*</span></label>
      <input type="text" id="in-position" placeholder="如：销售经理 / 前端工程师" maxlength="30">
      <div class="err">请填写面试岗位</div>
    </div>

    <label class="agree">
      <input type="checkbox" id="in-agree">
      <span>我已阅读并同意，以上信息及测试结果将用于本次面试评估，不用于其他用途。</span>
    </label>

    <div class="navrow">
      <button class="btn ghost" onclick="show(elStart)">返回</button>
      <button class="btn" onclick="submitInfo()">开始答题</button>
    </div>
  </section>

  <section id="screen-quiz">
    <div class="topbar">
      <span id="q-progress-text">第 1 / 180 题</span>
      <span id="q-answered">已答 0 题</span>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="q-progress-bar"></div></div>

    <div class="q-index" id="q-index">QUESTION 001</div>
    <div class="q-text" id="q-text"></div>
    <div id="q-options"></div>

    <div class="navrow">
      <button class="btn ghost" onclick="prevQ()">上一题</button>
      <button class="btn ghost" onclick="resetAll()">重新开始</button>
    </div>
  </section>

  <section id="screen-result">
    <div class="res-title">测试结果</div>

    <div class="card person-card">
      <div class="pc-item">
        <span class="pc-label">姓名</span>
        <span class="pc-val" id="res-name">—</span>
      </div>
      <div class="pc-item">
        <span class="pc-label">手机号</span>
        <span class="pc-val phone" id="res-phone">—</span>
      </div>
      <div class="pc-item">
        <span class="pc-label">面试岗位</span>
        <span class="pc-val" id="res-position">—</span>
      </div>
    </div>

    <div class="res-main">主型：<b id="res-main-type">—</b></div>

    <div class="legend">
      <span><i class="k-yes"></i>符合</span>
      <span><i class="k-unsure"></i>不确定</span>
      <span><i class="k-no"></i>不符合</span>
    </div>

    <div class="chart" id="chart"></div>

    <div class="card">
      <h3>主型解读</h3>
      <div id="res-desc">—</div>
    </div>

    <div class="card">
      <h3>说明</h3>
      <div style="color:#7a948d;font-size:13px">
        · 主型为「符合」次数最多者。<br>
        · 本测试用于自我认知参考，不作为心理诊断依据。
      </div>
    </div>

    <div class="navrow">
      <button class="btn" onclick="resetAll()">重新测试</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
/* =========================================================
   1. 九型基础信息
   ========================================================= */
const TYPES = {
  1: { name:"1号 完美型", short:"1号", color:"#e07a5f", desc:"追求正确与秩序，有强烈的是非感，习惯修正不完美的地方。压力下容易自我苛责、挑剔他人。" },
  2: { name:"2号 助人型", short:"2号", color:"#e8985e", desc:"敏锐察觉他人需要，乐于付出并渴望被需要。压力下容易忽略自己的需求、以付出换取认可。" },

  4: { name:"4号 自我型", short:"4号", color:"#9b7bb8", desc:"情感细腻、重视独特与真实，对美和意义高度敏感。压力下容易陷入情绪、自我怀疑。" },
  5: { name:"5号 理智型", short:"5号", color:"#5b8def", desc:"善于观察与分析，需要独立空间，用知识获得安全感。压力下容易退缩、过度抽离。" },
  6: { name:"6号 忠诚型", short:"6号", color:"#3aa8a0", desc:"谨慎、负责、重视承诺，习惯预判风险。压力下容易焦虑、反复确认。" },

  8: { name:"8号 领袖型", short:"8号", color:"#d96b7a", desc:"直接、有力量、敢担当，习惯掌控局面、保护身边人。压力下容易强硬、对抗。" },
  9: { name:"9号 和平型", short:"9号", color:"#7c8f99", desc:"温和、包容、善于协调，追求内在与人际的和谐。压力下容易回避冲突、拖延决断。" }

const TOTAL_Q = QUESTIONS.length;
const PER_TYPE = 20;

/* =========================================================
   3. 状态管理
   ========================================================= */
const STORAGE_KEY = "enneagram_180x3_state_v11";

let state = {
  user: { name:"", phone:"", position:"" },
  qOrder: [],
  answers: [],
  current: 0
};

let OPT_ORDER = [];

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const OPT_DEFS = [
  { key:"yes",    label:"符合" },
  { key:"unsure", label:"不确定" },
  { key:"no",     label:"不符合" }
];

function newState(user){
  OPT_ORDER = Array.from({ length: TOTAL_Q }, ()=> shuffle([0,1,2]));
  return {
    user: user ? { ...user } : { name:"", phone:"", position:"" },
    qOrder: shuffle([...Array(TOTAL_Q).keys()]),
    answers: new Array(TOTAL_Q).fill(null),
    current: 0
  };
}

function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !s.user || typeof s.user.name !== "string") return false;
    if (!Array.isArray(s.qOrder)  || s.qOrder.length  !== TOTAL_Q) return false;
    if (!Array.isArray(s.answers) || s.answers.length !== TOTAL_Q) return false;
    if (typeof s.current !== "number") return false;
    state = s;
    OPT_ORDER = Array.from({ length: TOTAL_Q }, ()=> shuffle([0,1,2]));
    return true;
  } catch(e){ return false; }
}

function clearState(){
  try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
}

/* =========================================================
   4. 统计：符合 / 不确定 / 不符合 次数
   ========================================================= */
function calcDistribution(){
  const dist = {};
  for (let i = 1; i <= 9; i++) dist[i] = { yes:0, unsure:0, no:0 };

  state.answers.forEach((ans, qi)=>{
    if (ans === null) return;
    const t = QUESTIONS[qi].type;
    dist[t][ans]++;
  });
  return dist;
}

/* =========================================================
   5. 界面控制
   ========================================================= */
const elStart  = document.getElementById("screen-start");
const elInfo   = document.getElementById("screen-info");
const elQuiz   = document.getElementById("screen-quiz");
const elResult = document.getElementById("screen-result");

function show(el){
  [elStart, elInfo, elQuiz, elResult].forEach(s => s.style.display = "none");
  el.style.display = "block";
  window.scrollTo(0,0);
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove("show"), 1800);
}

function goInfo(){
  document.getElementById("in-name").value     = state.user.name || "";
  document.getElementById("in-phone").value    = state.user.phone || "";
  document.getElementById("in-position").value = state.user.position || "";
  clearFieldErrors();
  show(elInfo);
}

function clearFieldErrors(){
  ["f-name","f-phone","f-position"].forEach(id=>{
    document.getElementById(id).classList.remove("invalid");
  });
}

function setFieldError(id){
  document.getElementById(id).classList.add("invalid");
}

function submitInfo(){
  clearFieldErrors();

  const name     = document.getElementById("in-name").value.trim();
  const phone    = document.getElementById("in-phone").value.trim();
  const position = document.getElementById("in-position").value.trim();
  const agree    = document.getElementById("in-agree").checked;

  let ok = true;
  if (!name){ setFieldError("f-name"); ok = false; }
  if (!/^1[3-9]\d{9}$/.test(phone)){ setFieldError("f-phone"); ok = false; }
  if (!position){ setFieldError("f-position"); ok = false; }
  if (!ok){ toast("请完整填写必填信息"); return; }
  if (!agree){ toast("请先勾选信息使用同意"); return; }

  state = newState({ name, phone, position });
  saveState();
  show(elQuiz);
  renderQ();
}

function renderQ(){
  const pos = state.current;
  const qi  = state.qOrder[pos];
  const q   = QUESTIONS[qi];

  const answered = state.answers.filter(a => a !== null).length;
  document.getElementById("q-progress-text").textContent = `第 ${pos + 1} / ${TOTAL_Q} 题`;
  document.getElementById("q-answered").textContent = `已答 ${answered} 题`;
  document.getElementById("q-progress-bar").style.width =
    `${(answered / TOTAL_Q * 100).toFixed(1)}%`;

  document.getElementById("q-index").textContent =
    `QUESTION ${String(pos + 1).padStart(3, "0")}`;
  document.getElementById("q-text").textContent = q.q;

  const box = document.getElementById("q-options");
  box.innerHTML = "";

  const letters = ["A","B","C"];
  const cur = state.answers[qi];
  const order = OPT_ORDER[qi];

  order.forEach((defIdx, i)=>{
    const o = OPT_DEFS[defIdx];
    const div = document.createElement("div");
    div.className = "opt" + (cur === o.key ? " chosen" : "");
    div.innerHTML = `<span class="tag">${letters[i]}</span><span>${o.label}</span>`;
    div.onclick = ()=> selectOption(qi, o.key);
    box.appendChild(div);
  });
}

function selectOption(qi, key){
  state.answers[qi] = key;
  saveState();

  if (state.current + 1 < TOTAL_Q){
    state.current++;
    saveState();
    renderQ();
  } else {
    renderResult();
  }
}

function prevQ(){
  if (state.current > 0){
    state.current--;
    saveState();
    renderQ();
  } else {
    toast("已经是第一题了");
  }
}

function resetAll(){
  if (!confirm("确定要重新开始吗？当前答题记录会清空。")) return;
  clearState();
  state = newState();
  document.getElementById("in-name").value = "";
  document.getElementById("in-phone").value = "";
  document.getElementById("in-position").value = "";
  document.getElementById("in-agree").checked = false;
  clearFieldErrors();
  show(elStart);
}

/* =========================================================
   6. 结果页
   ========================================================= */
function renderResult(){
  const dist = calcDistribution();

  const ranked = [1,2,3,4,5,6,7,8,9]
    .map(t => ({ type:t, yes:dist[t].yes, unsure:dist[t].unsure, no:dist[t].no }))
    .sort((a, b) => {
      if (b.yes    !== a.yes)    return b.yes - a.yes;
      if (b.unsure !== a.unsure) return b.unsure - a.unsure;
      return a.type - b.type;
    });

  const mainType = ranked[0].type;

  const u = state.user;
  document.getElementById("res-name").textContent     = u.name     || "—";
  document.getElementById("res-phone").textContent    = u.phone    || "—";
  document.getElementById("res-position").textContent = u.position || "—";

  document.getElementById("res-main-type").textContent = TYPES[mainType].name;

  const chart = document.getElementById("chart");
  chart.innerHTML = "";

  ranked.forEach((item, i)=>{
    const row = document.createElement("div");
    row.className = "row" + (i === 0 ? " top" : "");

    const w = n => (n / PER_TYPE) * 100;

    let segs = "";
    if (item.yes    > 0) segs += `<span class="seg seg-yes"    style="width:${w(item.yes)}%">${item.yes}</span>`;
    if (item.unsure > 0) segs += `<span class="seg seg-unsure" style="width:${w(item.unsure)}%">${item.unsure}</span>`;
    if (item.no     > 0) segs += `<span class="seg seg-no"     style="width:${w(item.no)}%">${item.no}</span>`;

    row.innerHTML = `
      <span class="name">${TYPES[item.type].name}</span>
      <span class="track">${segs}</span>
    `;
    chart.appendChild(row);
  });

  document.getElementById("res-desc").innerHTML =
    `<b style="color:${TYPES[mainType].color}">${TYPES[mainType].name}</b><br>${TYPES[mainType].desc}`;

  saveState();
  show(elResult);
}

/* =========================================================
   7. 启动
   ========================================================= */
(function init(){
  if (loadState()){
    const answered = state.answers.filter(a => a !== null).length;
    const startBtn = document.getElementById("start-btn");

    document.getElementById("in-name").value     = state.user.name || "";
    document.getElementById("in-phone").value    = state.user.phone || "";
    document.getElementById("in-position").value = state.user.position || "";

    if (answered === TOTAL_Q){
      startBtn.textContent = "查看上次结果";
      startBtn.onclick = ()=> renderResult();
    } else if (answered > 0){
      startBtn.textContent = `继续答题（已答 ${answered} 题）`;
      startBtn.onclick = ()=>{
        if (!state.user.name) goInfo();
        else { show(elQuiz); renderQ(); }
      };
    }
  }
})();
</script>
